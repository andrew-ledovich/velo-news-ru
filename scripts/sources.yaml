sources:
  - id: stockanalysis
    name: Stock Analysis
    feed: https://stockanalysis.com/news/all-stocks/
    enabled: true
    cap: 40
    feed_type: html_aggregate
    topic_boost: [macro, crypto, ai, ev]
    summary_workers: 4
    summary_max_paragraphs: 3
    summary_min_chars: 80
    summary_max_chars: 1500

topics:
  - id: ai
    label: AI
  - id: crypto
    label: CRYPTO
  - id: ev
    label: EV
  - id: macro
    label: MACRO

# Order matters: first regex that matches wins.
# Word boundaries (\b) are used to avoid false positives like "ai" inside "available".
classification:
  ai:
    - \b(ai|artificial intelligence)\b
    - \b(anthropic|openai|claude|chatgpt|gpt[- ]?\d|gemini|kimi|llm|deepseek|qwen|mistral|llama)\b
    - \b(machine learning|deep learning|inference|neural net|generative ai|transformer)\b
  ev:
    - \b(ev|electric vehicle|electric vehicles|evs)\b
    - \b(tesla|tsla|rivian|byd|nio|lucid|xpeng|li auto|polestar)\b
    - \b(battery|batteries|gigafactory|charging station)\b
  crypto:
    - \b(bitcoin|btc|ethereum|eth|solana|sol|cardano|ada|xrp|ripple|doge|dogecoin|avax|polkadot|dot|tron|trx|bnb|ton|toncoin|aptos|sui|near|sei|inj|injective|hyperliquid|hype|polymarket)\b
    - \b(crypto|cryptocurrency|blockchain|web3|defi|stablecoin|usdc|usdt|tether|stablecoin|l2|layer 2|rollup|zk[- ]?rollup|op mainnet|arbitrum|optimism|base|zksync|starknet)\b
    - \b(coinbase|binance|kraken|okx|bybit|bitfinex|gemini|ondo|paxos|sky|sky.maker|makerdao|aave|uniswap|curve|balancer|morpho|ethena|ena|usde|ondo|ondo finance)\b
    - \b(token|nft|dao|etf|spot etf|exchange[- ]?traded fund|halving|mining|staking|yield|airdrop)\b
  macro:
    - .*  # catch-all (default)

settings:
  user_agent: velo-news-ru/2.0 (+https://github.com/andrew-ledovich/velo-news-ru)
  request_timeout: 25
  per_request_delay_seconds: 0.15
  max_items: 200
  keep_days: 7
