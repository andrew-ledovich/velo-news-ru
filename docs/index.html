<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Русскоязычная лента: CRYPTO · AI · MACRO · EV" />
    <title>Velo News · RU</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Ctext x='50%25' y='55%25' font-family='monospace' font-size='18' font-weight='700' fill='%23ff8c00' text-anchor='middle' dominant-baseline='middle'%3EV%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">V</span>
          <span class="brand-title">Velo News · RU</span>
          <span class="brand-sub">CRYPTO · AI · MACRO · EV</span>
        </div>
        <div class="topbar-meta">
          <span class="meta-cell"><span class="meta-k">ВСЕГО</span><span class="meta-v" id="meta-count">0</span></span>
          <span class="meta-cell"><span class="meta-k">+24H</span><span class="meta-v up" id="meta-24h">0</span></span>
          <span class="meta-cell"><span class="meta-k">ИСТ.</span><span class="meta-v" id="meta-src">0</span></span>
          <span class="meta-cell"><span class="meta-k">ОБНОВЛЕНО</span><span class="meta-v" id="meta-updated">—</span></span>
        </div>
      </header>

      <section class="toolbar">
        <div class="pill-row" id="filter-row" aria-label="Тематические фильтры"></div>
        <label class="search">
          <span class="search-icon">⌕</span>
          <input id="search-input" type="search" placeholder="Поиск по заголовку или источнику" />
        </label>
      </section>

      <main class="content" id="content" role="status" aria-live="polite">
        <p class="empty">Загружаю ленту…</p>
      </main>

      <footer class="statusbar">
        <span class="status-pill ok" id="status-state">ОНЛАЙН</span>
        <span id="status-text">Velo News · RU · статическая публикация</span>
        <span class="spacer"></span>
        <span>Источники: TechCrunch · FT · CNBC · The Block · Fortune · Cointelegraph</span>
      </footer>
    </div>
    <script src="./app.js" defer></script>
  </body>
</html>
