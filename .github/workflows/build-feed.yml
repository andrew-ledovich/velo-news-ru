name: build-feed
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: pip install --quiet --disable-pip-version-check -r requirements.txt
      - name: Refresh feed
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/update_feed.py --output docs/data/news.json
      - name: Publish
        run: |
          set -euo pipefail
          if git diff --quiet docs/data/news.json; then
            echo "no changes"
            exit 0
          fi
          git config user.name "velo-news-ru-bot"
          git config user.email "velo-news-ru-bot@users.noreply.github.com"
          git add docs/data/news.json
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          git commit -m "chore: refresh feed ${ts}"
          git push
